<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - IntelliMent</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('{{ url_for("static", filename="images/bg.jpg") }}');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(30%);
            z-index: -1;
        }

        .otp-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #f59e0b;
            margin: 0 auto 25px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #ffffff, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 35px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .otp-input {
            width: 100%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 700;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .otp-input:focus {
            outline: none;
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .verify-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            filter: brightness(1.1);
        }

        .resend-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .resend-link:hover {
            color: #f59e0b;
        }

        .resend-link i {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="otp-container" data-aos="zoom-in">
    <div class="icon-box">
        <i class="fas fa-shield-alt"></i>
    </div>
    
    <h2>Security Check</h2>
    <p class="subtitle">Please enter the 6-digit code sent to your email to continue.</p>

    <form method="POST">
        <input type="text" 
               name="otp" 
               class="otp-input" 
               placeholder="000000" 
               maxlength="6" 
               required 
               autocomplete="one-time-code">
        
        <button type="submit" class="verify-btn">
            Verify Identity
        </button>
    </form>

    <a href="/resend_otp" class="resend-link">
        <i class="fas fa-redo-alt"></i> Didn't get the code? Resend OTP
    </a>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800 });
</script>

</body>
</html>
