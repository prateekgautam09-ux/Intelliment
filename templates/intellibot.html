<div id="ib-container">
    <div id="ib-bubble">Helloo....! I'm here 🧠</div>

    <div id="ib-icon" onclick="manualToggle()">
        <div class="aura"></div>
        <div class="inner-brain">
            <i class="fas fa-robot"></i>
        </div>
        <div class="ai-tag">AI</div>
    </div>

    <div id="ib-window">
        <div class="ib-header">
            <div class="ib-header-main">
                <div class="status-ring">
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="bot">
                    <span class="pulse-dot"></span>
                </div>
                <div class="ib-title">
                    <h4>IntelliBot</h4>
                    <span id="bot-status">Online</span>
                </div>
            </div>
            <div class="ib-close" onclick="manualToggle()">&times;</div>
        </div>

        <div class="ib-body" id="ib-messages">
            </div>

        <div class="ib-footer">
            <div class="input-wrap">
                <input type="text" id="ib-input" placeholder="Ask something..." autocomplete="off">
                <button id="send-btn" onclick="handleUserMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

:root {
    --primary-gradient: linear-gradient(135deg, #FF6B00 0%, #FF3D00 100%);
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.15);
}

#ib-container { 
    position: fixed; 
    bottom: 30px; 
    right: 30px; 
    z-index: 999999; 
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: flex-end; /* Keeps items aligned at the bottom */
}

/* Updated Icon Logic */
#ib-icon { 
    width: 75px; 
    height: 75px;  
    background: #DAA520; 
    border-radius: 24px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    position: relative; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
    transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    z-index: 100;
}


#ib-icon:hover { transform: scale(1.1) rotate(3deg); }
#ib-icon i { color: white; font-size: 32px; }

.ai-tag {
    position: absolute; 
    top: 5px; 
    background: white; 
    color: #FF3D00; 
    font-size: 10px; 
    font-weight: 800; 
    padding: 2px 6px; 
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* THE RIGHT-SIDE SLIDING ANIMATION */
#ib-window { 
    position: absolute; 
    bottom: 0; 
    right: 0; /* Align to the icon's edge */
    width: 360px; 
    height: 520px; 
    background: rgba(15, 15, 15, 0.95); 
    backdrop-filter: blur(25px); 
    border-radius: 30px; 
    border: 1px solid var(--border); 
    display: flex; 
    flex-direction: column; 
    box-shadow: 0 40px 80px rgba(0,0,0,0.6); 
    
    /* Animation Start State (Hidden behind/inside icon) */
    opacity: 0; 
    transform: translateX(50px) scale(0.8); 
    transform-origin: bottom right;
    transition: all 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6); 
    pointer-events: none; 
    z-index: 90;
}

/* Animation Active State (Slides to the LEFT of icon) */
#ib-window.active { 
    opacity: 1; 
    right: 90px; /* Moves window away from icon to the left */
    transform: translateX(0) scale(1); 
    pointer-events: all; 
}

/* Bubble Logic */
#ib-bubble { 
    position: absolute; 
    right: 0; 
    bottom: 85px; 
    background: grey; 
    color: black; 
    padding: 10px 18px; 
    border-radius: 18px 18px 2px 18px; 
    font-size: 13px; 
    font-weight: 600; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    white-space: nowrap; 
    opacity: 0; 
    transform: translateY(10px); 
    transition: 0.5s; 
    pointer-events: none; 
}

/* Standard UI Elements (Header, Body, Footer) */
.ib-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.ib-header-main { display: flex; align-items: center; gap: 12px; }
.status-ring { position: relative; width: 42px; height: 42px; background: var(--glass); border-radius: 50%; padding: 3px; }
.status-ring img { width: 100%; height: 100%; border-radius: 50%; }
.pulse-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background: #00FF85; border-radius: 50%; border: 2px solid #000; animation: pulse 2s infinite; }
.ib-title h4 { margin: 0; color: white; font-size: 16px; }
.ib-title span { color: #888; font-size: 11px; }

.ib-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
.msg-wrap { padding: 12px 18px; border-radius: 20px; font-size: 14px; max-width: 85%; line-height: 1.5; }
.bot-msg { background: var(--glass); color: #ddd; border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; }
.user-msg { background: #FF3D00; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }

.point-item { display: block; margin-top: 8px; color: #FF6B00; font-weight: 600; }
.point-text { color: #ddd; font-weight: 400; margin-left: 5px; }

.ib-footer { padding: 15px 20px; }
.input-wrap { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 5px 12px; display: flex; align-items: center; border: 1px solid var(--border); }
.input-wrap input { flex: 1; background: none; border: none; color: white; outline: none; padding: 10px; font-size: 14px; }
.input-wrap button { background: var(--primary-gradient); border: none; width: 38px; height: 38px; border-radius: 12px; color: white; cursor: pointer; transition: 0.3s; }
.input-wrap button:hover { transform: scale(1.05); filter: brightness(1.2); }

@keyframes auraPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.4); opacity: 0.2; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 133, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(0, 255, 133, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 255, 133, 0); } }
.ib-close { font-size: 22px; color: #888; cursor: pointer; transition: 0.3s; }
.ib-close:hover { color: #FF3D00; transform: rotate(90deg); }
</style>

<script>
// All original logic remains the same as requested
const win = document.getElementById("ib-window");
const bubble = document.getElementById("ib-bubble");
const msgContainer = document.getElementById("ib-messages");
let userInteracted = false;

function manualToggle() {
    userInteracted = true;
    win.classList.toggle("active");
    bubble.style.opacity = "0";
}

async function typeReply(text, element) {
    const words = text.split(" ");
    element.innerHTML = "";
    for (let i = 0; i < words.length; i++) {
        let word = words[i];
        if (word.startsWith("*") || word.startsWith("-")) {
            element.innerHTML += `<br><span class="point-item">● <span class="point-text">`;
            word = word.substring(1); 
        }
        element.innerHTML += word + " ";
        msgContainer.scrollTop = msgContainer.scrollHeight;
        await new Promise(resolve => setTimeout(resolve, 70));
    }
}

const bubbleTexts = ["Helloo! I'm here 🧠", " Need help.. ?", "Ask me anything about viva 🎓", "I can help you instantly 🤖"];
let bubbleIndex = 0;
let bubbleTextInterval = null;

function showBubble() {
    if(win.classList.contains('active')) return;
    clearInterval(bubbleTextInterval);
    bubble.style.opacity = "1";
    bubble.style.transform = "translateY(0)";
    bubble.innerText = bubbleTexts[bubbleIndex];
    bubbleTextInterval = setInterval(() => {
        bubbleIndex = (bubbleIndex + 1) % bubbleTexts.length;
        bubble.innerText = bubbleTexts[bubbleIndex];
    }, 3000);
    setTimeout(hideBubble, 6000);
}

function hideBubble() {
    bubble.style.opacity = "0";
    bubble.style.transform = "translateY(10px)";
    clearInterval(bubbleTextInterval);
}

setInterval(() => { if (!userInteracted) showBubble(); }, 10000);

function handleUserMessage() {
    const input = document.getElementById("ib-input");
    const val = input.value.trim();
    if(!val) return;
    userInteracted = true;
    const userDiv = document.createElement("div");
    userDiv.className = "msg-wrap user-msg";
    userDiv.innerText = val;
    msgContainer.appendChild(userDiv);
    input.value = "";
    msgContainer.scrollTop = msgContainer.scrollHeight;

    setTimeout(async () => {
        const botDiv = document.createElement("div");
        botDiv.className = "msg-wrap bot-msg";
        msgContainer.appendChild(botDiv);
        try {
            const res = await fetch("/intellibot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: val, role: "guest" })
            });
            const data = await res.json();
            typeReply(data.reply, botDiv);
        } catch (err) {
            botDiv.innerText = "⚠️ Intellibot is offline right now.";
        }
    }, 600);
}

document.getElementById("ib-input").addEventListener("keypress", (e) => { if(e.key === "Enter") handleUserMessage(); });

setTimeout(() => {
    const welcomeDiv = document.createElement("div");
    welcomeDiv.className = "msg-wrap bot-msg";
    msgContainer.appendChild(welcomeDiv);
    typeReply("<b>👋 Welcome to IntelliMent!</b> <br>I’m IntelliBot 🤖, here to help you with assessments, practice sessions, and performance insights.</br> <br>How can I assist you today?</br>", welcomeDiv);
}, 1000);
</script>
